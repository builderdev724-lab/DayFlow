[package]
name = "dayflow"
version = "0.4.0"
description = "A lightweight local-first daily work planner"
authors = ["Priyojeet"]
edition = "2021"
rust-version = "1.77.2"
license = "MIT"

[lib]
name = "dayflow_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
tauri = { version = "2.11.5", features = ["tray-icon"] }
notify-rust = "4.18.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.37.0", features = ["bundled"] }
chrono = { version = "0.4", features = ["clock"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
