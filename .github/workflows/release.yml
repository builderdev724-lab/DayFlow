name: Release Linux

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm

      - name: Enable pnpm
        run: corepack enable && corepack prepare pnpm@10.15.0 --activate

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            curl \
            file \
            pkg-config \
            libglib2.0-dev \
            libgtk-3-dev \
            libgdk-pixbuf2.0-dev \
            libpango1.0-dev \
            libcairo2-dev \
            libatk1.0-dev \
            libwebkit2gtk-4.1-dev \
            libjavascriptcoregtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            xdg-utils

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "src-tauri -> target"

      - name: Install frontend dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Verify synchronized version
        run: pnpm verify:version

      - name: Verify tag matches app version
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          APP_VERSION=$(node -p "require('./package.json').version")
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          test "$APP_VERSION" = "$TAG_VERSION" || {
            echo "Tag $GITHUB_REF_NAME does not match package version $APP_VERSION"
            exit 1
          }

      - name: Build and publish Tauri release
        uses: tauri-apps/tauri-action@action-v1.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "Dayflow ${{ github.ref_name }}"
          releaseBody: |
            ## Dayflow ${{ github.ref_name }}

            Download the Linux installer below.

            - `.deb` — recommended for Ubuntu/Debian
            - `.AppImage` — portable Linux build
          releaseDraft: false
          prerelease: false
          generateReleaseNotes: true
          args: ""
