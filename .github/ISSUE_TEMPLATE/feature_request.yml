name: Feature request
description: Propose an improvement for Dayflow
title: "feat: "
labels: [enhancement]
body:
  - type: textarea
    attributes:
      label: Problem
      description: What problem would this feature solve?
    validations:
      required: true
  - type: textarea
    attributes:
      label: Proposal
      description: Describe the behavior you would like.
    validations:
      required: true
  - type: textarea
    attributes:
      label: Alternatives
      description: Describe any alternative solutions you considered.
